      CidrIp: !Ref PeerIp4
      Description: !Sub "Solana Transaction Forwarding (UDP) from peer IP ${PeerIp4}"

  PeerGossipTcpIngress5:
    Type: "AWS::EC2::SecurityGroupIngress"
    Condition: HasPeerIp5
    Properties:
