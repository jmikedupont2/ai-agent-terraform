AWSTemplateFormatVersion: "2010-09-09"
Metadata:
    Generator: "former2"
Description: "minimal ec2 asg and lt for solfunmeme solana"
Parameters:

  GitRepo:
    Type: "String"
    Description: "git repo for the agent you can modify this to your own repo"
    Default :  "https://github.com/meta-introspector/services/"

  GitBranch:
    Type: "String"
    Description: "git branch for the agent you can modify this to your own branch"
    Default: "deployment/v0.0.1-solana-test-validator"

  AgentCodeName:
    Type: 'String'
    Description: 'Agent codename for finding parameters'
    Default: 'tine_agent_2'
      
  ChainName:
    Type: 'String'
    Description: 'Name of your chain'
    Default: 'SOLFUNMEME'

  LaunchTemplateVersion:
    Type: "String"
    Default: "1"
    Description: 'advanced option to use newer versions of launch templatesz'

  AvailabilityZone:
    Type: "String"
    Description: 'is appended to region name to create az'
    Default: "a"

  AmiId:
    Type: "String"
    Description: 'aws image id that is specific to the region you must also accept the licence for the ami'
 
  PeerIps:
    Type: List<String>
    Description: "List of peer IP addresses for Solana nodes (in CIDR notation, e.g., 192.168.1.100/32, 203.0.113.10/32)"
    #Default: ["8.8.8.8/32"]

Resources:
  MyDHCPOptions:
    Type: AWS::EC2::DHCPOptions
    DeletionPolicy: Delete
    Properties:
      DomainNameServers:
        - AmazonProvidedDNS

  IAMRoleAgent:
    Type: "AWS::IAM::Role"
    Properties:
      Path: "/"
      RoleName: !Sub '${ChainName}_ssm-tine-deploy-agent-role'
      AssumeRolePolicyDocument: "{\"Version\":\"2012-10-17\",\"Statement\":[{\"Sid\":\"\",\"Effect\":\"Allow\",\"Principal\":{\"Service\":\"ec2.amazonaws.com\"},\"Action\":\"sts:AssumeRole\"}]}"
      MaxSessionDuration: 3600
      ManagedPolicyArns:
      #- IAMManagedPolicy2
      - "arn:aws:iam::aws:policy/AmazonSSMManagedInstanceCore"
      - "arn:aws:iam::aws:policy/AmazonSSMPatchAssociation"
      - "arn:aws:iam::aws:policy/AmazonSSMManagedEC2InstanceDefaultPolicy"
      Policies:
        - PolicyName: 'SSMDescribeParametersPolicy'
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: 'VisualEditor0'
                Effect: 'Allow'
                Action: 'ssm:DescribeParameters'
                Resource: '*'
                
  IAMInstanceProfile:
    DependsOn:
      - IAMRoleAgent
    Type: AWS::IAM::InstanceProfile
    Properties:
      Path: "/"
      InstanceProfileName: !Sub "${ChainName}_agent-instance-profile"
      Roles:
        - !Ref IAMRoleAgent

  EC2VPC:
    Type: "AWS::EC2::VPC"
    Properties:
        CidrBlock: "10.0.0.0/16"
        EnableDnsSupport: true
        EnableDnsHostnames: true

  EC2SubnetPublicA:
    Type: "AWS::EC2::Subnet"
    Properties:
        AvailabilityZone: !Sub "${AWS::Region}${AvailabilityZone}"
        CidrBlock: "10.0.4.0/24"
        VpcId:
          Ref: "EC2VPC"
        MapPublicIpOnLaunch: false

  ### setup vpc with routes
  RouteTable:
    Type: "AWS::EC2::RouteTable"
    DependsOn:
      - InternetGateway
    Properties:
      VpcId:
        Ref: "EC2VPC"
        
  InternetGateway:
    Type: "AWS::EC2::InternetGateway"
    
  VPCGatewayAttachment:
    DependsOn:
      - InternetGateway
    Type: "AWS::EC2::VPCGatewayAttachment"
    Properties:
      VpcId:
        Ref: "EC2VPC"
      InternetGatewayId: !Ref "InternetGateway"
      
  InternetRoute:
    Type: "AWS::EC2::Route"
    DependsOn:
      - InternetGateway
      - RouteTable
    Properties:
      DestinationCidrBlock: "0.0.0.0/0"
      GatewayId: !Ref InternetGateway
      RouteTableId: !Ref RouteTable

  SubnetARouteTableAssociation:
    Type: "AWS::EC2::SubnetRouteTableAssociation"
    Properties:
      RouteTableId: !Ref RouteTable
      SubnetId: !Ref EC2SubnetPublicA

  EC2SecurityGroup:
    Type: "AWS::EC2::SecurityGroup"
    Properties:
      GroupDescription: "Security group for Solana node"
      GroupName: "solana-node-solana"
      SecurityGroupEgress:
        - CidrIp: "0.0.0.0/0"
          Description: "All protocols IPv4"
          IpProtocol: "-1"
        - CidrIpv6: "::/0"
          Description: "All protocols IPv6"
          IpProtocol: "-1"
      SecurityGroupIngress:
        - CidrIp: "0.0.0.0/0"
          Description: "Solana Gossip Protocol (TCP)"
          IpProtocol: "tcp"
          FromPort: 8000
          ToPort: 8000
        - CidrIp: "0.0.0.0/0"
          Description: "Solana Gossip Protocol (UDP)"
          IpProtocol: "udp"
          FromPort: 8000
          ToPort: 8000
        - CidrIp: "0.0.0.0/0"
          Description: "Solana RPC Port (TCP)"
          IpProtocol: "tcp"
          FromPort: 8899
          ToPort: 8899
        - CidrIp: "0.0.0.0/0"
          Description: "Solana Transaction Forwarding (UDP)"
          IpProtocol: "udp"
          FromPort: 8001
          ToPort: 8008
        - CidrIp: "0.0.0.0/0"
          Description: "SSH access for management"
          IpProtocol: "tcp"
          FromPort: 22
          ToPort: 22
        - SourceSecurityGroupId: !Ref SolanaPeerSecurityGroup
          Description: "Allow Solana TCP traffic from peer security group"
          IpProtocol: "tcp"
          FromPort: 8000
          ToPort: 8899
        - SourceSecurityGroupId: !Ref SolanaPeerSecurityGroup
          Description: "Allow Solana UDP traffic from peer security group"
          IpProtocol: "udp"
          FromPort: 8000
          ToPort: 8008
      VpcId:
        Ref: "EC2VPC"

  SolanaPeerSecurityGroup:
    Type: "AWS::EC2::SecurityGroup"
    Properties:
      GroupDescription: "Security group for Solana peer nodes"
      GroupName: "solana-peer-group"
      SecurityGroupEgress:
        - CidrIp: "0.0.0.0/0"
          Description: "All protocols IPv4"
          IpProtocol: "-1"
        - CidrIpv6: "::/0"
          Description: "All protocols IPv6"
          IpProtocol: "-1"
      VpcId:
        Ref: "EC2VPC"

  # Dynamic ingress rules for PeerIps (up to 5 IPs)
  PeerGossipTcpIngress0:
    Type: "AWS::EC2::SecurityGroupIngress"
    Properties:
      GroupId: !Ref SolanaPeerSecurityGroup
      IpProtocol: "tcp"
      FromPort: 8000
      ToPort: 8000
      CidrIp: !Select [0, !Ref PeerIps]
      Description: !Sub "Solana Gossip Protocol (TCP) from peer IP ${!Select [0, !Ref PeerIps]}"

  PeerGossipUdpIngress0:
    Type: "AWS::EC2::SecurityGroupIngress"
    Properties:
      GroupId: !Ref SolanaPeerSecurityGroup
      IpProtocol: "udp"
      FromPort: 8000
      ToPort: 8000
      CidrIp: !Select [0, !Ref PeerIps]
      Description: !Sub "Solana Gossip Protocol (UDP) from peer IP ${!Select [0, !Ref PeerIps]}"

  PeerRpcIngress0:
    Type: "AWS::EC2::SecurityGroupIngress"
    Properties:
      GroupId: !Ref SolanaPeerSecurityGroup
      IpProtocol: "tcp"
      FromPort: 8899
      ToPort: 8899
      CidrIp: !Select [0, !Ref PeerIps]
      Description: !Sub "Solana RPC Port (TCP) from peer IP ${!Select [0, !Ref PeerIps]}"

  PeerTransactionIngress0:
    Type: "AWS::EC2::SecurityGroupIngress"
    Properties:
      GroupId: !Ref SolanaPeerSecurityGroup
      IpProtocol: "udp"
      FromPort: 8001
      ToPort: 8008
      CidrIp: !Select [0, !Ref PeerIps]
      Description: !Sub "Solana Transaction Forwarding (UDP) from peer IP ${!Select [0, !Ref PeerIps]}"

  PeerGossipTcpIngress1:
    Type: "AWS::EC2::SecurityGroupIngress"
    Condition: HasPeerIp1
    Properties:
      GroupId: !Ref SolanaPeerSecurityGroup
      IpProtocol: "tcp"
      FromPort: 8000
      ToPort: 8000
      CidrIp: !Select [1, !Ref PeerIps]
      Description: !Sub "Solana Gossip Protocol (TCP) from peer IP ${!Select [1, !Ref PeerIps]}"

  PeerGossipUdpIngress1:
    Type: "AWS::EC2::SecurityGroupIngress"
    Condition: HasPeerIp1
    Properties:
      GroupId: !Ref SolanaPeerSecurityGroup
      IpProtocol: "udp"
      FromPort: 8000
      ToPort: 8000
      CidrIp: !Select [1, !Ref PeerIps]
      Description: !Sub "Solana Gossip Protocol (UDP) from peer IP ${!Select [1, !Ref PeerIps]}"

  PeerRpcIngress1:
    Type: "AWS::EC2::SecurityGroupIngress"
    Condition: HasPeerIp1
    Properties:
      GroupId: !Ref SolanaPeerSecurityGroup
      IpProtocol: "tcp"
      FromPort: 8899
      ToPort: 8899
      CidrIp: !Select [1, !Ref PeerIps]
      Description: !Sub "Solana RPC Port (TCP) from peer IP ${!Select [1, !Ref PeerIps]}"

  PeerTransactionIngress1:
    Type: "AWS::EC2::SecurityGroupIngress"
    Condition: HasPeerIp1
    Properties:
      GroupId: !Ref SolanaPeerSecurityGroup
      IpProtocol: "udp"
      FromPort: 8001
      ToPort: 8008
      CidrIp: !Select [1, !Ref PeerIps]
      Description: !Sub "Solana Transaction Forwarding (UDP) from peer IP ${!Select [1, !Ref PeerIps]}"

  PeerGossipTcpIngress2:
    Type: "AWS::EC2::SecurityGroupIngress"
    Condition: HasPeerIp2
    Properties:
      GroupId: !Ref SolanaPeerSecurityGroup
      IpProtocol: "tcp"
      FromPort: 8000
      ToPort: 8000
      CidrIp: !Select [2, !Ref PeerIps]
      Description: !Sub "Solana Gossip Protocol (TCP) from peer IP ${!Select [2, !Ref PeerIps]}"

  PeerGossipUdpIngress2:
    Type: "AWS::EC2::SecurityGroupIngress"
    Condition: HasPeerIp2
    Properties:
      GroupId: !Ref SolanaPeerSecurityGroup
      IpProtocol: "udp"
      FromPort: 8000
      ToPort: 8000
      CidrIp: !Select [2, !Ref PeerIps]
      Description: !Sub "Solana Gossip Protocol (UDP) from peer IP ${!Select [2, !Ref PeerIps]}"

  PeerRpcIngress2:
    Type: "AWS::EC2::SecurityGroupIngress"
    Condition: HasPeerIp2
    Properties:
      GroupId: !Ref SolanaPeerSecurityGroup
      IpProtocol: "tcp"
      FromPort: 8899
      ToPort: 8899
      CidrIp: !Select [2, !Ref PeerIps]
      Description: !Sub "Solana RPC Port (TCP) from peer IP ${!Select [2, !Ref PeerIps]}"

  PeerTransactionIngress2:
    Type: "AWS::EC2::SecurityGroupIngress"
    Condition: HasPeerIp2
    Properties:
      GroupId: !Ref SolanaPeerSecurityGroup
      IpProtocol: "udp"
      FromPort: 8001
      ToPort: 8008
      CidrIp: !Select [2, !Ref PeerIps]
      Description: !Sub "Solana Transaction Forwarding (UDP) from peer IP ${!Select [2, !Ref PeerIps]}"

  PeerGossipTcpIngress3:
    Type: "AWS::EC2::SecurityGroupIngress"
    Condition: HasPeerIp3
    Properties:
      GroupId: !Ref SolanaPeerSecurityGroup
      IpProtocol: "tcp"
      FromPort: 8000
      ToPort: 8000
      CidrIp: !Select [3, !Ref PeerIps]
      Description: !Sub "Solana Gossip Protocol (TCP) from peer IP ${!Select [3, !Ref PeerIps]}"

  PeerGossipUdpIngress3:
    Type: "AWS::EC2::SecurityGroupIngress"
    Condition: HasPeerIp3
    Properties:
      GroupId: !Ref SolanaPeerSecurityGroup
      IpProtocol: "udp"
      FromPort: 8000
      ToPort: 8000
      CidrIp: !Select [3, !Ref PeerIps]
      Description: !Sub "Solana Gossip Protocol (UDP) from peer IP ${!Select [3, !Ref PeerIps]}"

  PeerRpcIngress3:
    Type: "AWS::EC2::SecurityGroupIngress"
    Condition: HasPeerIp3
    Properties:
      GroupId: !Ref SolanaPeerSecurityGroup
      IpProtocol: "tcp"
      FromPort: 8899
      ToPort: 8899
      CidrIp: !Select [3, !Ref PeerIps]
      Description: !Sub "Solana RPC Port (TCP) from peer IP ${!Select [3, !Ref PeerIps]}"

  PeerTransactionIngress3:
    Type: "AWS::EC2::SecurityGroupIngress"
    Condition: HasPeerIp3
    Properties:
      GroupId: !Ref SolanaPeerSecurityGroup
      IpProtocol: "udp"
      FromPort: 8001
      ToPort: 8008
      CidrIp: !Select [3, !Ref PeerIps]
      Description: !Sub "Solana Transaction Forwarding (UDP) from peer IP ${!Select [3, !Ref PeerIps]}"

  PeerGossipTcpIngress4:
    Type: "AWS::EC2::SecurityGroupIngress"
    Condition: HasPeerIp4
    Properties:
      GroupId: !Ref SolanaPeerSecurityGroup
      IpProtocol: "tcp"
      FromPort: 8000
      ToPort: 8000
      CidrIp: !Select [4, !Ref PeerIps]
      Description: !Sub "Solana Gossip Protocol (TCP) from peer IP ${!Select [4, !Ref PeerIps]}"

  PeerGossipUdpIngress4:
    Type: "AWS::EC2::SecurityGroupIngress"
    Condition: HasPeerIp4
    Properties:
      GroupId: !Ref SolanaPeerSecurityGroup
      IpProtocol: "udp"
      FromPort: 8000
      ToPort: 8000
      CidrIp: !Select [4, !Ref PeerIps]
      Description: !Sub "Solana Gossip Protocol (UDP) from peer IP ${!Select [4, !Ref PeerIps]}"

  PeerRpcIngress4:
    Type: "AWS::EC2::SecurityGroupIngress"
    Condition: HasPeerIp4
    Properties:
      GroupId: !Ref SolanaPeerSecurityGroup
      IpProtocol: "tcp"
      FromPort: 8899
      ToPort: 8899
      CidrIp: !Select [4, !Ref PeerIps]
      Description: !Sub "Solana RPC Port (TCP) from peer IP ${!Select [4, !Ref PeerIps]}"

  PeerTransactionIngress4:
    Type: "AWS::EC2::SecurityGroupIngress"
    Condition: HasPeerIp4
    Properties:
      GroupId: !Ref SolanaPeerSecurityGroup
      IpProtocol: "udp"
      FromPort: 8001
      ToPort: 8008
      CidrIp: !Select [4, !Ref PeerIps]
      Description: !Sub "Solana Transaction Forwarding (UDP) from peer IP ${!Select [4, !Ref PeerIps]}"

  EC2SecurityGroup:
    Type: "AWS::EC2::SecurityGroup"
    Properties:
      GroupDescription: "An internal security group"
      GroupName: "solfunmeme-internal"
      SecurityGroupEgress:
        -
          CidrIp: "0.0.0.0/0"
          Description: "All protocols"
          IpProtocol: "-1"
        -
          CidrIpv6: "::/0"
          Description: "All protocols"
          IpProtocol: "-1"
      VpcId:
        Ref: "EC2VPC"

  EC2LaunchTemplate:
    Type: "AWS::EC2::LaunchTemplate"
    Properties:
      LaunchTemplateName: "agent-docker-t4g.small-launch-template"
      LaunchTemplateData:
        IamInstanceProfile:
          Name: !Ref IAMInstanceProfile
        NetworkInterfaces:
          -
            AssociatePublicIpAddress: true
            # this will cost if you have more than one instance
            
            DeleteOnTermination: true
            DeviceIndex: 0
            Groups:
              - !Ref EC2SecurityGroup
              - !Ref SolanaPeerSecurityGroup
            NetworkCardIndex: 0
        ImageId: !Sub "${AmiId}"
        InstanceType: "t4g.small"
        UserData:
          Fn::Base64: !Sub |
              #!/bin/bash -xe
              export AGENT_NAME="${AgentCodeName}"
              export CHAIN_NAME="${ChainName}"
              export GIT_REPO="${GitRepo}" # FIXME
              export GIT_BRANCH="${GitBranch}" # FIXME
              mkdir /etc/solana/              
              echo AGENT_NAME="${AgentCodeName}" > /etc/solana/env
              echo CHAIN_NAME="${ChainName}" >> /etc/solana/env
              echo GIT_REPO="${GitRepo}" >> /etc/solana/env
              echo GIT_BRANCH="${GitBranch}"  >> /etc/solana/env
              export HOME=/root
              apt update
              apt-get install -y ec2-instance-connect git wget unzip systemd curl
              apt-get install -y cloud-utils apt-transport-https ca-certificates curl software-properties-common              
              apt-get update              
              snap install amazon-ssm-agent --classic || echo oops1
              snap start amazon-ssm-agent || echo oops2
              if [ ! -d "/opt/agent/" ]; then
                git clone "${GitRepo}" "/opt/agent/"
              fi
              cd "/opt/services/" || exit 1
              git stash
              git fetch --all
              git checkout --track --force "origin/${GitBranch}"
              bash -x /opt/services/scripts/bootstrap.sh
              

        BlockDeviceMappings:
          -
            DeviceName: "/dev/sda1"
            Ebs:
              Encrypted: true
              # free https://www.reddit.com/r/aws/comments/8vulq0/does_encryption_cost_money_on_aws_ebs_volumes/
              VolumeSize: 30
              VolumeType: "gp3"

  AWSServiceRoleForAutoScaling:
    Type: AWS::IAM::ServiceLinkedRole
    Properties:
      CustomSuffix: !Sub '${AgentCodeName}'
      AWSServiceName: autoscaling.amazonaws.com
      
  AutoScalingAutoScalingGroup:
    Type: "AWS::AutoScaling::AutoScalingGroup"
    DependsOn:
      - EC2LaunchTemplate
      - AWSServiceRoleForAutoScaling
    
    Properties:      
      Tags:
        -
          Key : Name
          Value: !Sub "${AgentCodeName}-agent"
          PropagateAtLaunch : true

      AutoScalingGroupName: "docker-agent-ami-t4g.small"
      LaunchTemplate:
        LaunchTemplateName:  "agent-docker-t4g.small-launch-template"
        Version: !Ref LaunchTemplateVersion
      MinSize: 1
      MaxSize: 2
      DesiredCapacity: 1
      Cooldown: 300
      AvailabilityZones:
        - !Sub "${AWS::Region}${AvailabilityZone}"
        #              - "us-west-1b"
      HealthCheckType: "EC2"
      HealthCheckGracePeriod: 300
      VPCZoneIdentifier:
        - !Ref EC2SubnetPublicA
      TerminationPolicies:
        - "Default"
      ServiceLinkedRoleARN: !Sub "arn:aws:iam::${AWS::AccountId}:role/aws-service-role/autoscaling.amazonaws.com/AWSServiceRoleForAutoScaling_${AgentCodeName}"
      NewInstancesProtectedFromScaleIn: false

Conditions:
  HasPeerIp1: !Not [!Equals [!Select [1, !Ref PeerIps], ""]]
  HasPeerIp2: !Not [!Equals [!Select [2, !Ref PeerIps], ""]]
  HasPeerIp3: !Not [!Equals [!Select [3, !Ref PeerIps], ""]]
  HasPeerIp4: !Not [!Equals [!Select [4, !Ref PeerIps], ""]]
