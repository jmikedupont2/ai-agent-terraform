      IpProtocol: "udp"
      FromPort: 8001
      ToPort: 8008
      CidrIp: !Ref PeerIp2
      Description: !Sub "Solana Transaction Forwarding (UDP) from peer IP ${PeerIp2}"

  PeerGossipTcpIngress3:
    Type: "AWS::EC2::SecurityGroupIngress"
    Condition: HasPeerIp3
    Properties:
      GroupId: !Ref EC2SecurityGroup
      IpProtocol: "tcp"
      FromPort: 8000
      ToPort: 8000
      CidrIp: !Ref PeerIp3
      Description: !Sub "Solana Gossip Protocol (TCP) from peer IP ${PeerIp3}"

  PeerGossipUdpIngress3:
    Type: "AWS::EC2::SecurityGroupIngress"
    Condition: HasPeerIp3
    Properties:
      GroupId: !Ref EC2SecurityGroup
      IpProtocol: "udp"
      FromPort: 8000
      ToPort: 8000
      CidrIp: !Ref PeerIp3
      Description: !Sub "Solana Gossip Protocol (UDP) from peer IP ${PeerIp3}"

  PeerRpcIngress3:
    Type: "AWS::EC2::SecurityGroupIngress"
    Condition: HasPeerIp3
    Properties:
