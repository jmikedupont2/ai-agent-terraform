      Description: !Sub "Solana Transaction Forwarding (UDP) from peer IP ${PeerIp3}"

  PeerGossipTcpIngress4:
    Type: "AWS::EC2::SecurityGroupIngress"
    Condition: HasPeerIp4
    Properties:
      GroupId: !Ref EC2SecurityGroup
      IpProtocol: "tcp"
      FromPort: 8000
      ToPort: 8000
      CidrIp: !Ref PeerIp4
      Description: !Sub "Solana Gossip Protocol (TCP) from peer IP ${PeerIp4}"

  PeerGossipUdpIngress4:
