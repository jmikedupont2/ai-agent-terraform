      CidrIp: !Ref PeerIp4
      Description: !Sub "Solana Gossip Protocol (UDP) from peer IP ${PeerIp4}"

  PeerRpcIngress4:
    Type: "AWS::EC2::SecurityGroupIngress"
    Condition: HasPeerIp4
    Properties:
      GroupId: !Ref EC2SecurityGroup
      IpProtocol: "tcp"
      FromPort: 8899
