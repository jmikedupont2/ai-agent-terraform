      CidrIp: !Ref PeerIp5
      Description: !Sub "Solana RPC Port (TCP) from peer IP ${PeerIp5}"

  PeerTransactionIngress5:
    Type: "AWS::EC2::SecurityGroupIngress"
    Condition: HasPeerIp5
    Properties:
