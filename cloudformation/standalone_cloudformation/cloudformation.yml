      IpProtocol: "tcp"
      FromPort: 8899
      ToPort: 8899
      CidrIp: !Ref PeerIp3
      Description: !Sub "Solana RPC Port (TCP) from peer IP ${PeerIp3}"

  PeerTransactionIngress3:
    Type: "AWS::EC2::SecurityGroupIngress"
    Condition: HasPeerIp3
    Properties:
      GroupId: !Ref EC2SecurityGroup
      IpProtocol: "udp"
      FromPort: 8001
