      CidrIp: !Ref PeerIp4
      Description: !Sub "Solana RPC Port (TCP) from peer IP ${PeerIp4}"

  PeerTransactionIngress4:
    Type: "AWS::EC2::SecurityGroupIngress"
    Condition: HasPeerIp4
    Properties:
      GroupId: !Ref EC2SecurityGroup
      IpProtocol: "udp"
      FromPort: 8001
